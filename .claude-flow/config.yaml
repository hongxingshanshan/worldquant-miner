# RuFlo V3 Runtime Configuration
# Updated: 2026-05-09

version: "3.0.0"

providers:
  anthropic:
    apiKey: "${ANTHROPIC_API_KEY}"
    baseUrl: "${ANTHROPIC_BASE_URL}"
    model: "glm-5.1"
    models:
      haiku: "glm-5.1"
      sonnet: "glm-5.1"
      opus: "glm-5.1"

agents:
  defaultModel: "glm-5.1"
  modelMapping:
    haiku: "glm-5.1"
    sonnet: "glm-5.1"
    opus: "glm-5.1"

modelRouter:
  defaultModel: "glm-5.1"
  fallbackModel: "glm-5.1"

swarm:
  topology: mesh
  maxAgents: 5
  autoScale: true
  coordinationStrategy: consensus

memory:
  backend: memory
  enableHNSW: false
  persistPath: .claude-flow/data
  cacheSize: 100
  learningBridge:
    enabled: false
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: false
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: false
    defaultScope: project

neural:
  enabled: false
  modelPath: .claude-flow/neural

hooks:
  enabled: true
  autoExecute: true

mcp:
  autoStart: false
  port: 3000
